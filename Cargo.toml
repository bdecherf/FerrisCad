[package]
name = "ferriscad"
version = "0.1.0"
edition = "2021"
description = "Schematic + PCB layout editor with an AI assistant for circuit debugging"

[dependencies]
eframe = "=0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
crc32fast = "1.5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
